name: policy-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov==3.3.10

      - name: Run Checkov
        run: checkov --config-file .checkov.yml
